[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-search-mcp"
version = "0.4.1"
description = "High-performance web search to JSON/Markdown service powered by Camoufox and FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "camoufox[geoip]>=0.4.11",
    "playwright>=1.58.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdownify>=0.14.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "mcp>=1.25.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "nuitka>=2.0.0",
    "ordered-set>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
web-search-mcp = "src.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real browser + network (deselect with '-m not integration')",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
