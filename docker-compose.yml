services:
  web-search-mcp:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: web-search-mcp
    ports:
      - "${MCP_PORT:-8897}:8897"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8897
      - BROWSER_POOL_SIZE=${BROWSER_POOL_SIZE:-18}
      - BROWSER_MAX_POOL_SIZE=${BROWSER_MAX_POOL_SIZE:-36}
      - MAX_SEARCH_LOGS=${MAX_SEARCH_LOGS:-100}
      - BROWSER_PROXY=${BROWSER_PROXY:-}
      - BROWSER_PROXY_LIST_FILE=${BROWSER_PROXY_LIST_FILE:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - WSM_DB_PATH=/data/wsm.db
      - REDIS_URL=redis://redis:6379/0
      # Lightweight "less" fetch backend — reached over the internal network only.
      - OBSCURA_CDP_URL=ws://obscura:9222/devtools/browser
      - OBSCURA_CONCURRENCY=${OBSCURA_CONCURRENCY:-4}
    volumes:
      - wsm-data:/data
    depends_on:
      redis:
        condition: service_healthy
      obscura:
        condition: service_started
    restart: unless-stopped
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 4g

  # Obscura — lightweight ("less") headless browser engine (Rust + CDP), the
  # second page-fetch backend alongside Camoufox. Its CDP endpoint has NO auth,
  # so it is deliberately NOT published to the host: only the compose network can
  # reach obscura:9222. External clients keep going through the API-key-protected
  # MCP endpoint on 8897, which is the only thing bound outward.
  obscura:
    image: h4ckf0r0day/obscura:0.1.3
    platform: linux/amd64
    container_name: wsm-obscura
    command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--stealth"]
    expose:
      - "9222"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: wsm-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  wsm-data:
  redis-data:
